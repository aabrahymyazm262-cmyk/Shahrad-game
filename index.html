<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شکار مگس‌های شهراد</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  overflow: hidden;
  font-family: Tahoma, sans-serif;
  text-align: center;
  background: linear-gradient(#63ddeb 0%, #b5f5dc 72%, #65d477 72%);
}

#sun {
  position: absolute;
  top: 65px;
  right: 35px;
  width: 85px;
  height: 85px;
  background: #ffe65b;
  border-radius: 50%;
  box-shadow: 0 0 35px #fff4a0;
}

h2 {
  color: #08715d;
  margin-top: 15px;
}

#score {
  position: relative;
  z-index: 5;
  background: white;
  border-radius: 15px;
  padding: 12px;
  margin: 12px auto;
  width: 90%;
  max-width: 380px;
  font-weight: bold;
  color: #08715d;
}

#photo {
  position: relative;
  z-index: 6;
  width: 90%;
  max-width: 300px;
  background: white;
  padding: 8px;
  border-radius: 12px;
}

#ground {
  position: absolute;
  bottom: 0;
  height: 25%;
  width: 100%;
  background: #58c96a;
}

#poop {
  position: absolute;
  bottom: 23%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 90px;
  z-index: 2;
}

.fly {
  position: absolute;
  width: 72px;
  height: 72px;
  border: 3px solid #333;
  border-radius: 50%;
  background: #333;
  cursor: pointer;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: buzz 0.8s infinite alternate;
}

.fly img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}

@keyframes buzz {
  from { transform: translateY(-4px) rotate(-5deg); }
  to { transform: translateY(4px) rotate(5deg); }
}

#message {
  display: none;
  position: absolute;
  z-index: 10;
  top: 30%;
  left: 5%;
  width: 90%;
  padding: 25px 10px;
  border: 5px solid #ffe45c;
  border-radius: 25px;
  background: white;
  color: #087b51;
  font-size: 24px;
  font-weight: bold;
}

#message button {
  padding: 12px 22px;
  border: none;
  border-radius: 12px;
  background: #20b978;
  color: white;
  font-size: 18px;
}
</style>
</head>

<body>

<div id="sun"></div>

<h2>🪰 شکار مگس‌های شهراد 🪰</h2>

<div id="score">
  مگس‌های باقی‌مانده: <span id="left">20</span>
  <br><br>
  مگس‌های شکارشده: <span id="dead">0</span>
</div>

<input id="photo" type="file" accept="image/*">

<div id="ground"></div>
<div id="poop">💩</div>

<div id="message">
  🎉 هــــوراااااا! 🎉
  <br><br>
  برنده شدیییی!
  <br>
  آفرین شکارچی شهراد 🏆
  <br><br>
  <button onclick="location.reload()">دوباره بازی کن</button>
</div>

<script>
let killed = 0;
let created = 0;
let face = "";

const photo = document.getElementById("photo");

photo.addEventListener("change", function(event) {
  const file = event.target.files[0];

  if (!file) return;

  if (face) URL.revokeObjectURL(face);

  face = URL.createObjectURL(file);

  document.querySelectorAll(".fly").forEach(fly => {
    fly.innerHTML = "";
    const img = document.createElement("img");
    img.src = face;
    fly.appendChild(img);
  });
});

function makeFly() {
  if (created >= 20) return;

  created++;

  const fly = document.createElement("div");
  fly.className = "fly";

  if (face) {
    const img = document.createElement("img");
    img.src = face;
    fly.appendChild(img);
  } else {
    fly.textContent = "🪰";
  }

  fly.style.left = (Math.random() * 75 + 10) + "%";
  fly.style.top = (Math.random() * 45 + 30) + "%";

  fly.addEventListener("click", function() {
    if (fly.dataset.hit) return;
    fly.dataset.hit = "yes";

    killed++;

    document.getElementById("dead").textContent = killed;
    document.getElementById("left").textContent = 20 - killed;

    const msg = document.createElement("div");
    msg.textContent = "😂 شهراد شکار شد!";
    msg.style.cssText = `
      position:absolute;
      top:${fly.offsetTop}px;
      left:${fly.offsetLeft}px;
      z-index:8;
      background:white;
      padding:8px;
      border-radius:12px;
      font-weight:bold;
    `;

    document.body.appendChild(msg);

    fly.remove();

    setTimeout(() => msg.remove(), 600);

    if (killed === 20) {
      setTimeout(() => {
        document.getElementById("message").style.display = "block";
      }, 650);
    }
  });

  document.body.appendChild(fly);
}

const interval = setInterval(() => {
  if (created < 20) {
    makeFly();
  } else {
    clearInterval(interval);
  }
}, 850);
</script>

</body>
</html>
